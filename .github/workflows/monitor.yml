name: Monitor de Investimentos

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:

  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Garantir registros fixos no banco
        run: |
          python3 << 'PYEOF'
          import json
          from pathlib import Path

          arq = Path("dados/investimentos.json")
          dados = json.loads(arq.read_text(encoding="utf-8"))

          # IDs que devem sempre existir com dados corretos
          fixos = {
              9: {"empresa": "Obramax"},
              60: {
                  "id": 60,
                  "empresa": "Obramax",
                  "ano": 2026,
                  "valor": 140000000.0,
                  "empregos": "170 diretos + 30 terceirizados",
                  "bairro": "Av. Presidente Juscelino Kubitschek (Via Expressa)",
                  "status": "Em construção",
                  "ultima_atualizacao": "2026-05-20",
                  "eventos": [],
                  "fase": "Construção",
                  "fonte": "O Tempo",
                  "url": "https://www.otempo.com.br/economia/2026/5/20/obramax-investe-r-140-milhoes-em-nova-loja-em-contagem-e-tem-vagas-de-emprego-abertas",
                  "origem": "historico",
                  "descricao": "Segunda unidade em MG. Loja de 17.922 m2 proxima ao Itau Power Shopping. Inauguracao prevista 2o semestre 2026."
              }
          }

          ids_existentes = {d["id"]: i for i, d in enumerate(dados)}

          # Corrigir id 9 (nome)
          if 9 in ids_existentes:
              dados[ids_existentes[9]]["empresa"] = "Obramax"

          # Adicionar id 60 se não existir
          if 60 not in ids_existentes:
              dados.append(fixos[60])
              print("Obramax 2026 adicionada (id 60)")
          else:
              print("Obramax 2026 ja existe (id 60)")

          arq.write_text(json.dumps(dados, ensure_ascii=False, indent=4), encoding="utf-8")
          print(f"Total registros: {len(dados)}")
          PYEOF

      - name: Executar monitor
        run: python monitor.py

      - name: Copiar HTML mais recente
        run: |
          ULTIMO=$(ls -t relatorios/relatorio_*.html 2>/dev/null | head -1)
          if [ -n "$ULTIMO" ]; then
            cp "$ULTIMO" relatorios/ultimo_relatorio.html
            echo "Copiado: $ULTIMO"
          fi

      - name: Salvar no repositório
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -f relatorios/
          git add -f dados/
          git diff --cached --name-only
          git commit -m "Monitor $(date +'%d/%m/%Y %H:%M') - automático"
          git pull --rebase origin main
          git push origin main
